<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stride study app</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2446f5"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script><script defer src="/katex/contrib/mhchem.min.js"></script><script defer src="/katex/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: upbeat coach, short sentences, honest about pace
   IDEA: a pocket deck of fact cards you climb like stairs, against the clock
   PICTURE: daily-goal ring + week strip on a cobalt band; in lessons the card and the timer
   COLOUR and TYPE: cobalt field, sunflower accent, coral flame and countdown; Fredoka display, Nunito text
   LAYOUT: one 520px column on phones, 760px on tablets, two columns on the laptop home screen; fixed action bar in lessons */
:root{color-scheme:light dark;--bg:light-dark(#f4f6ff,#0b0f2a);--card:light-dark(#fff,#151a3d);--ink:light-dark(#141833,#eef0ff);--mute:light-dark(#575d85,#a7acd6);--line:light-dark(#dde2f5,#2a3062);--blue:#2446f5;--blue2:light-dark(#1a33c4,#7b8fff);--sel:light-dark(#e8ecff,#1c2560);--sun:#ffc531;--coral:#ff5b4a;--ok:#12a160;--okbg:light-dark(#dcf7e8,#0f3324);--bad:#e0402f;--badbg:light-dark(#ffe4e0,#3a1512);--warnbg:light-dark(#fff4d6,#3a2e0c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px}
.brand{font:700 26px Fredoka,sans-serif;color:var(--blue2)}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;gap:5px;align-items:center;font:600 17px Fredoka,sans-serif;padding:5px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line);min-height:40px}
.pill svg{width:20px;height:20px}.pill.off svg path{fill:var(--line)}button.pill{cursor:pointer}
.hero{margin:0 14px;border-radius:26px;background:var(--blue);color:#fff;padding:20px;display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:center;box-shadow:0 6px 0 #142a9e}
.hero h1{font:600 23px/1.15 Fredoka,sans-serif;margin:0 0 4px;text-wrap:balance}.hero p{margin:0 0 14px;opacity:.9}
.ring{position:relative;width:128px;height:128px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}.ring .trk{stroke:rgba(255,255,255,.2)}.ring .val{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .8s}
.rtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}.rtxt b{font:700 34px Fredoka,sans-serif}.rtxt span{font-size:13px;opacity:.85}
.week{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.2);padding-top:14px}
.day{display:grid;justify-items:center;gap:4px;font:600 13px Fredoka,sans-serif}
.dot{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}.dot.on{background:var(--sun)}.dot.today{outline:2px solid #fff;outline-offset:2px}
.btn{font:600 18px Fredoka,sans-serif;border:0;border-radius:16px;padding:12px 22px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.sun{background:var(--sun);color:#1b1b1b}.btn.blue{background:var(--blue);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:default}
.wide{width:calc(100% - 28px);margin:0 14px}
h2{font:600 20px Fredoka,sans-serif;margin:28px 18px 10px}
.cat{font:700 14px Nunito,sans-serif;color:var(--mute);margin:16px 18px 8px}
.warn,.rev{display:flex;gap:12px;align-items:center;margin:14px 14px 0;padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--coral)}
.warn svg{width:30px;height:30px;flex:none}.warn p,.rev p{margin:0;flex:1}.rev{border-color:var(--sun)}.rev .btn{min-height:44px;padding:8px 16px;font-size:16px}
.tcard{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px;margin:0 14px 12px;cursor:pointer}
.tcard b{font:600 18px/1.25 Fredoka,sans-serif;display:block}.tcard small{color:var(--mute);display:block;margin:2px 0 8px}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:700 22px Fredoka,sans-serif;color:#fff}
.prog{display:block;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chev{width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.del{width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:24px;cursor:pointer;border-radius:12px}.del.arm{font:700 13px Nunito,sans-serif;color:var(--bad);width:auto}
.flag{display:inline-block;font:700 12px Nunito,sans-serif;background:var(--sel);color:var(--blue2);padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.panel{margin:0 14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.panel.dash{border-style:dashed}
.panel label,.lbl{display:block;font-weight:800;margin:0 0 6px}
.panel .help{color:var(--mute);font-size:14px;margin:-2px 0 10px}
.field{margin-bottom:16px}
.mrow{display:flex;gap:10px}
input.txt,textarea.txt,input.ans{flex:1;width:100%;font:700 17px Nunito,sans-serif;padding:12px 14px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
textarea.txt{min-height:110px;font-weight:600;font-size:16px;resize:vertical}
input[type=file]{width:100%;font-size:15px;padding:10px;border:2px dashed var(--line);border-radius:14px;background:var(--bg)}
input.ans{background:var(--card);font-size:19px}
.stcard{margin-top:4px}.sthead{display:flex;align-items:center;justify-content:space-between;margin:22px 18px 10px}.sthead h2{margin:0}
.stcard .stats b{font-size:19px}.stbest{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 18px 0;color:var(--mute);font-size:14px}.stbest b{color:var(--ink)}
.stsub{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.hero.sthero{display:block;grid-template-columns:none;text-align:center;padding:22px}.stlbl{opacity:.85;font-weight:700}.stbig{display:block;font:600 44px/1.1 Fredoka,sans-serif;margin:4px 0}.sthero p{margin:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bcol i{display:block;width:100%;max-width:36px;background:var(--line);border-radius:8px 8px 4px 4px}.bcol.on i{background:var(--blue)}
.bcol small{font-size:11px;color:var(--mute);white-space:nowrap}.bcol span{font-size:12px;font-weight:700;color:var(--mute)}.bcol.on span{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 14px}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stats b{display:block;font:600 24px Fredoka,sans-serif}.stats span{font-size:13px;color:var(--mute)}
.pace{margin:12px 14px 0;display:grid;gap:10px}
.prow{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--ok);border-radius:16px;padding:12px 14px}
.prow.ok{border-left-color:var(--sun)}.prow.bad{border-left-color:var(--bad)}.prow.none{border-left-color:var(--line)}
.prow b{font:600 18px Fredoka,sans-serif}.prow p{margin:2px 0 0;font-size:15px}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 14px 0}.goal>span{font-weight:700;margin-right:4px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:44px;font-weight:700;cursor:pointer}.chip.on{border-color:var(--blue2);background:var(--sel);color:var(--blue2)}
.sync{color:var(--mute);font-size:14px;margin:18px 18px 0}
.subhead{display:flex;align-items:center;gap:8px;padding:12px 10px}
.subhead h1{font:600 24px/1.15 Fredoka,sans-serif;margin:0;flex:1}
.back{width:44px;height:44px;border:0;background:none;cursor:pointer;color:var(--ink);border-radius:12px;display:grid;place-items:center}
.mats{list-style:none;margin:0 0 12px;padding:0}.mats li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mats small{color:var(--mute);white-space:nowrap}
.lhead{display:flex;align-items:center;gap:10px;padding:14px 14px}
.x{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--mute);font-size:30px;cursor:pointer;flex:none}
.lback svg{width:26px;height:26px}.lback{margin-left:-8px}
.lbar{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}.lbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .35s}
.combo{font:600 14px Fredoka,sans-serif;color:var(--coral);white-space:nowrap}
.tmr{font:600 16px Fredoka,sans-serif;padding:6px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.tmr.low{border-color:var(--coral);color:var(--coral)}.tmr.over{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-size:14px}
.stage{padding:8px 18px 220px}
.fact{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--line)}
.tag{display:inline-block;background:var(--sun);color:#1b1b1b;font:600 14px Fredoka,sans-serif;padding:4px 12px;border-radius:99px}
.ttl{display:block;color:var(--mute);margin-top:10px}
.fact>p.big{font:500 clamp(21px,5.6vw,25px)/1.35 Fredoka,sans-serif;margin:6px 0 0}
.sec{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.sec h4{font:600 16px Fredoka,sans-serif;margin:0 0 4px;color:var(--blue2)}.sec p{margin:0}
.sec.ex h4{color:var(--ok)}.sec.mis h4{color:var(--bad)}
.steps{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font:600 15px Fredoka,sans-serif;display:grid;place-items:center}
.ansline{font:600 20px Fredoka,sans-serif;margin-top:12px}
ul.bul{margin:4px 0 0;padding-left:20px}
.hint{color:var(--mute);text-align:center;margin-top:18px}
.kind{color:var(--mute);font-weight:800;font-size:14px}.kind em{font-style:normal;padding:1px 8px;border-radius:99px;background:var(--sel);color:var(--blue2);margin-left:6px}
.qp{font:600 clamp(21px,5.8vw,27px)/1.25 Fredoka,sans-serif;margin:6px 0 20px;text-wrap:balance}
.opts{display:grid;gap:12px}.tfrow{grid-template-columns:1fr 1fr}
.opt{font:700 17px Nunito,sans-serif;padding:14px 16px;min-height:58px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);text-align:left;cursor:pointer}
.tfrow .opt{text-align:center;font-size:19px}
.opt.sel{border-color:var(--blue2);background:var(--sel)}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.explain{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.explain .meta{font-weight:800;margin:0 0 8px}.explain .meta.no{color:var(--bad)}
details summary{cursor:pointer;font-weight:800;color:var(--blue2);min-height:32px}
.act{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line);z-index:3}
.act.ok{background:var(--okbg);border-color:transparent}.act.bad{background:var(--badbg);border-color:transparent}.act.late{background:var(--warnbg);border-color:transparent}
.act .btn{width:100%}
.fb h3{font:600 22px Fredoka,sans-serif;margin:0 0 8px}.act.ok h3{color:var(--ok)}.act.bad h3{color:var(--bad)}.gain{font-size:16px;color:var(--ink);opacity:.75;margin-left:6px}
.cd{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.cd span{font:700 min(48vw,220px)/1 Fredoka,sans-serif;color:var(--coral);opacity:.9;text-shadow:0 8px 0 rgba(0,0,0,.12)}
.cd.beat span{animation:beat .9s ease-out}
@keyframes beat{from{transform:scale(1.35);opacity:1}to{transform:scale(.9);opacity:.55}}
.modal{position:fixed;inset:0;background:rgba(5,8,30,.55);display:grid;place-items:center;padding:20px;z-index:8}
.mbox{background:var(--card);border-radius:24px;padding:26px 22px;width:min(400px,100%);text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.mbox h3{font:600 26px/1.1 Fredoka,sans-serif;margin:0 0 6px}.mbox p{margin:0 0 20px;color:var(--mute);font-size:18px}
.mbox .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dwrap{padding:44px 22px;text-align:center}
.medal{width:140px;height:140px;margin:0 auto 6px;display:block}
.dwrap h1{font:600 34px/1.05 Fredoka,sans-serif;margin:8px 0 20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.tiles div{border:2px solid var(--line);border-radius:16px;padding:12px 2px;background:var(--card)}.tiles b{display:block;font:600 24px Fredoka,sans-serif}.tiles span{font-size:13px;color:var(--mute)}
.msg{background:var(--card);border-radius:16px;padding:12px 16px;margin:0 0 10px;border-left:6px solid var(--sun);text-align:left;font-weight:700}.msg.bad{border-left-color:var(--bad)}.msg.good{border-left-color:var(--ok)}
.dwrap .btn{width:100%;margin-top:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 14px 14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:5px}
.tabs button{border:0;border-radius:12px;min-height:44px;background:none;font:600 17px Fredoka,sans-serif;cursor:pointer}.tabs button.on{background:var(--blue);color:#fff}
.lb{margin:0 14px;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.lrow .rk{font:700 20px Fredoka,sans-serif;color:var(--mute);text-align:center}.lrow.top1 .rk{color:#d79b00}.lrow.me{background:var(--sel)}
.lrow .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lrow .xp{font:600 18px Fredoka,sans-serif;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--mute)}
.load{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 93%,transparent);display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px;z-index:9}
.load p{font:600 20px Fredoka,sans-serif;max-width:320px}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--blue);animation:sp .9s linear infinite}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(480px,calc(100% - 28px));background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:14px;font-weight:700;z-index:10}
.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pop,.spin,.cd.beat span{animation:none}.ring .val,.lbar i{transition:none}}
@media(max-width:400px){.hero{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:16px}.ring{width:104px;height:104px}.rtxt b{font-size:28px}.stats,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dot{width:26px;height:26px}.combo{display:none}}
.gate{min-height:100dvh;display:grid;place-content:center;justify-items:center;text-align:center;padding:32px 24px;gap:14px}
.gate h1{font:700 44px/1 Fredoka,sans-serif;color:var(--blue2);margin:0}.gate p{margin:0;max-width:340px;color:var(--mute);font-size:17px}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:2px solid #dadce0;box-shadow:0 4px 0 #dadce0}
.gbtn svg{width:22px;height:22px}
.gate form{width:min(360px,100%);display:grid;gap:12px;text-align:left}
.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 14px 0}.acct span{flex:1 1 100%;color:var(--mute);font-size:15px}
.linkb{background:none;border:0;color:var(--blue2);font-weight:800;min-height:44px;padding:0 6px;cursor:pointer;text-decoration:underline}
.tgt{display:flex;gap:14px;align-items:center;margin:14px 14px 0;padding:14px 16px;border-radius:20px;background:var(--card);border:2px solid var(--blue2)}
.tgt .mini{width:58px;height:58px;flex:none;position:relative}.tgt .mini svg{width:100%;height:100%;transform:rotate(-90deg)}.tgt .mini circle{fill:none;stroke-width:9}.tgt .mini .trk{stroke:var(--line)}.tgt .mini .val{stroke:currentColor;stroke-linecap:round}
.tgt .mini b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px Fredoka,sans-serif}
.tgt h3{font:600 18px/1.2 Fredoka,sans-serif;margin:0 0 2px}.tgt p{margin:0;font-size:15px}.tgt>div{flex:1}
.tgt.s1{color:var(--blue2)}.tgt.s1 h3,.tgt.s1 p{color:var(--ink)}
.tgt.s2{border-color:#f08a00;background:var(--warnbg);color:#d97800}.tgt.s2 h3{color:#b86200}
.tgt.s3{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.tgt.s3 h3{color:var(--bad)}.tgt.s3{animation:nudge 2.4s ease-in-out infinite}
.tgt.ok{border-color:var(--ok);color:var(--ok)}
.tgt .linkb{padding:0;min-height:32px}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:translateX(-3px)}96%{transform:translateX(3px)}}
.pill.met{border-color:var(--sun);background:var(--warnbg)}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-weight:400;margin:0;cursor:pointer}
label.chk:last-child{border-bottom:0}label.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--blue)}label.chk small{display:block;color:var(--mute)}
.ttrow{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.ttrow:last-child{border-bottom:0}
.ttrow label.chk{border:0}.ttrow .chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}.ttrow .chip{min-height:36px;padding:4px 12px;font-size:14px}
input.tm{min-height:44px;padding:6px 10px;font-size:16px}input.tm:disabled{opacity:.45}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
input.num{min-height:44px;padding:6px 10px;text-align:center}
select.txt{width:100%;font:700 17px Nunito,sans-serif;padding:10px 12px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.thctx{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0 10px;font-size:15px;white-space:pre-line}
textarea.thans{width:100%;min-height:150px;resize:vertical;margin-top:12px;font:inherit;line-height:1.5}

const ulev=u=>[1,2,3].map(L=>LES[u.id+'-L'+L]||GEN[u.id+'-L'+L]);
const unitT=(s,u)=>({id:u.id,title:u.name,color:s.color,levels:s.builtin?u.levels:ulev(u),custom:!s.builtin,max:s.builtin?u.levels.length:3,sub:s,unit:u});

function uItems(s,u){const t=unitT(s,u),p=P(u.id),lv=[1,2,3].map(L=>facts(t,L)),have=lv.filter(a=>a.length);

  return `<div class="tgt s${st}" role="status">${ring}<div><h3>${h}</h3><p>${p} ${edit}</p></div></div>`;

const r1=x=>Math.round(x*10)/10;
const weekOf=k=>{const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return dkey(new Date(y,m-1,d-(dt.getDay()+6)%7))};
const stDay=(st,k)=>+((st&&st.d&&st.d[k])||0);
const stWeek=(st,w)=>[0,1,2,3,4,5,6].reduce((a,i)=>a+stDay(st,addDays(w,i)),0);
const stMonth=(st,ym)=>Object.entries((st&&st.d)||{}).reduce((a,[k,v])=>a+(k.startsWith(ym)?+v||0:0),0);
function logStudy(k,m){if(!(m>0))return;const st=S.st;st.d[k]=r1(stDay(st,k)+m);st.tot=r1((st.tot||0)+m);
  if(st.d[k]>(st.bd.m||0))st.bd={d:k,m:st.d[k]};const w=weekOf(k),wm=r1(stWeek(st,w));if(wm>(st.bw.m||0))st.bw={w,m:wm};
  const cut=addDays(k,-400);Object.keys(st.d).forEach(x=>{if(x<cut)delete st.d[x]})}
function stSummary(st,d){d=d||today();return{day:stDay(st,d),week:stWeek(st,weekOf(d)),month:stMonth(st,d.slice(0,7)),all:+((st&&st.tot)||0),bd:(st&&st.bd)||{m:0},bw:(st&&st.bw)||{m:0}}}

const fmtDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
const fmtWk=w=>{const [y,m,d]=w.split('-').map(Number);return 'Week of '+new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
function studyCard(){const x=stSummary(S.st);

function jsonText(v,key,depth=0){
  if(depth>30||v==null)return '';
  if(typeof v==='string')return (key&&!/^\d+$/.test(key)?key+': ':'')+v;
  if(typeof v==='number'||typeof v==='boolean')return key?key+': '+v:String(v);
  if(Array.isArray(v))return v.map((x,i)=>jsonText(x,String(i),depth+1)).filter(Boolean).join('\n');
  const body=Object.entries(v).map(([k,x])=>jsonText(x,k,depth+1)).filter(Boolean).join('\n');
  return key&&!/^\d+$/.test(key)?`\n## ${key}\n${body}`:body+'\n';
}

async function excerpts(s,u){

async function create(title){

/* ---------- lessons ---------- */
async function startTopic(id,again,practice){
  let t=byId(id);if(!t)return;
  if(t.unit&&!t.sub.builtin&&!LOADED.has(t.sub.id)){try{loading(true,'Loading lesson…');await loadLessons(t.sub.id)}catch(e){}finally{loading(false)}t=byId(id)}
  if(!again&&!practice&&quizReady(t)&&!quizPassed(t.id)){await loadPQ(t.sub.id).catch(()=>{});return renderQuizIntro(t.id)}
  const p=P(t.id);S.cur=t.id;advance(t);
  if(t.custom&&!t.levels[p.lvl-1]&&!again&&!AION()){toast(p.lvl>1?`Level ${p.lvl} of ${t.title} isn't ready yet. Keep revising, and check back soon.`:`${t.title} isn't ready yet. Check back soon.`);return}
  if(t.custom&&!t.levels[p.lvl-1]&&!again){try{const k=t.id+'-L'+p.lvl;let lv=t.unit?await fetchGen(k):null;
    if(!lv){lv=await build(t,p.lvl);if(t.unit){if(ADMIN)await putLesson(k,t.sub.id,lv);else await putGen(k,lv)}else t.levels[p.lvl-1]=lv}
    save();return startTopic(id,true)}catch(e){toast(errMsg(e));return}}
  if(!t.levels[Math.min(p.lvl,t.levels.length)-1]){toast('This lesson is not ready yet. Try again in a moment.');return}
  const L=Math.min(p.lvl,t.levels.length),fs=facts(t,L),seen=f=>p.f[f.id],bx=f=>seen(f)?seen(f).b:0;
  const norms=fs.filter(f=>!f.w),works=fs.filter(f=>f.w);
  const take=(arr,n)=>{let a=arr.filter(f=>!seen(f)).slice(0,n);if(a.length<n)a=a.concat(arr.filter(f=>seen(f)&&seen(f).b<1).slice(0,n-a.length));return a};
  let per=3;if(t.unit&&!t.sub.builtin&&uSess(t.unit)){const [tot]=uItems(t.sub,t.unit);per=Math.max(1,Math.min(3,Math.round(tot/uSess(t.unit))))}
  const picks=take(norms,works.length?Math.min(2,per):per).concat(take(works,works.length&&per<2?1:2));
  const ids=new Set(picks.map(f=>f.id));
  let rev=allFacts(t).filter(f=>!ids.has(f.id)&&seen(f)&&seen(f).due<=today()).sort((a,b)=>bx(a)-bx(b)).slice(0,2);
  if(!picks.length&&!rev.length)rev=shuffle(allFacts(t)).sort((a,b)=>bx(a)-bx(b)).slice(0,4);
  begin(picks.map(f=>({t,f})),rev.map(f=>({t,f})));
}
function begin(learn,rev){
  const steps=[],pool=[],ask=(x,q,o)=>Object.assign({k:'ask',q},x,o||{});
  learn.filter(x=>!x.f.w).forEach(x=>{steps.push(Object.assign({k:'learn',again:!!P(x.t.id).f[x.f.id]},x),ask(x,x.f.q[0]));if(x.f.q[1])pool.push(ask(x,x.f.q[1]))});
  const wk=learn.filter(x=>x.f.w);
  wk.forEach(x=>steps.push(Object.assign({k:'learn',again:!!P(x.t.id).f[x.f.id],shown:0},x)));
  wk.forEach(x=>x.f.q.forEach(q=>steps.push(ask(x,q,{practice:true}))));
  rev.forEach(x=>pool.push(ask(x,x.f.q[Math.random()*x.f.q.length|0],{rev:true})));
  steps.push(...shuffle(pool));

/* ---------- theory questions ----------
   The student writes an answer; it is marked against the question's key points. Each key point shows a green tick
   if the answer covers it or a red cross if not, and earns TH_XP. With a Claude API key set, Claude judges each point
   by meaning; otherwise the app looks for the point's key words and phrases (spelling slips allowed). */
const TH_XP=5;
const thNorm=t=>String(t||'').toLowerCase().replace(/π/g,' pi ').replace(/ω/g,' w ').replace(/\bomega\b/g,' w ').replace(/τ/g,' tau ').replace(/δ/g,' delta ').replace(/σ/g,' sigma ').replace(/∞/g,' infinity ').replace(/√/g,' sqrt ').replace(/²/g,' 2 ').replace(/³/g,' 3 ').replace(/¹/g,' 1 ').replace(/[⁰⁴⁵⁶⁷⁸⁹]/g,c=>' '+'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)+' ').replace(/½/g,' 1 2 ').replace(/⅓/g,' 1 3 ').replace(/¼/g,' 1 4 ').replace(/¾/g,' 3 4 ').replace(/[^a-z0-9]+/g,' ').trim();

  outer:for(let i=0;i+p.length<=toks.length;i++){if(i>0&&p[0]!=='not'&&p[0]!=='non'&&TH_NEG.has(toks[i-1]))continue;for(let j=0;j<p.length;j++){const a=toks[i+j],b=p[j];if(a===b)continue;if(b.length>=5&&a.length>=4&&lev(a,b)<=1)continue;continue outer}return true}return false}

function thGap(toks,phrase){const segs=String(phrase).split('*').map(thToks).filter(x=>x.length);if(segs.length<2)return thHas(toks,phrase);
  const at=(seg,from,to)=>{for(let i=from;i<=Math.min(to,toks.length-seg.length);i++){if(i>0&&TH_NEG.has(toks[i-1])&&i===from&&from===0)continue;let ok=true;for(let j=0;j<seg.length;j++){const a=toks[i+j],b=seg[j];if(a!==b&&!(b.length>=5&&a.length>=4&&lev(a,b)<=1)){ok=false;break}}if(ok)return i}return -1};
  for(let st=at(segs[0],0,toks.length);st>=0;st=at(segs[0],st+1,toks.length)){let pos=st+segs[0].length,ok=true;
    for(const seg of segs.slice(1)){const f=at(seg,pos,pos+16);if(f<0){ok=false;break}pos=f+seg.length}if(ok)return true}return false}

const thLocal=(q,text)=>{const toks=thToks(text);return q.pts.map(pt=>thPoint(toks,pt))};
async function thMark(q,text){
  if(AION()){try{const out=await ai(`You are marking a student's answer to an exam question in a university or secondary-school course.
${q.ctx?`Context given in the exam:\n${q.ctx}\n`:''}Question (${q.marks} mark${q.marks===1?'':'s'}):\n${q.p}\n
Marking points:\n${q.pts.map((p,i)=>`${i+1}. ${p.t} (${p.m||1} mark${(p.m||1)===1?'':'s'})`).join('\n')}\n
Model answer, for reference:\n${q.model||''}\n
Student's answer:\n<<<\n${text}\n>>>\n
For each marking point, decide whether the student's answer covers it correctly. Judge the meaning, not the exact words; accept correct equivalent working, notation and examples. A point the student states wrongly does not count.
Return JSON: {"points":[true or false for each marking point, in order],"feedback":"one or two short sentences telling the student what to add or fix"}`,{json:true});
    if(out&&Array.isArray(out.points)&&out.points.length===q.pts.length)return{hit:out.points.map(Boolean),fb:String(out.feedback||'').slice(0,400),by:'ai'}}catch(e){}}

function thResult(q,res){const n=q.pts.length,got=res.hit.filter(Boolean).length,tot=q.pts.reduce((a,p)=>a+(p.m||1),0),gm=q.pts.reduce((a,p,i)=>a+(res.hit[i]?(p.m||1):0),0);

  <ul class="thpts">${q.pts.map((p,i)=>`<li class="${res.hit[i]?'ok':'no'}"><span class="mk" aria-label="${res.hit[i]?'Covered':'Missing'}">${res.hit[i]?'✓':'✗'}</span><span>${esc(p.t)}${(p.m||1)>1?` <small>(${p.m} marks)</small>`:''}</span></li>`).join('')}</ul>

// view: null for the live lesson, or {nextTxt, go} when looking back (re-marking then changes nothing).

// A round extends the streak only if it has something not yet learned: a new fact, one the student

/* timer: limit → 5s big countdown → 30s grace (no XP) → "taking a while" popup */

const lines=v=>String(v||'').split('\n').map(x=>x.trim()).filter(Boolean);
const MATH_HELP='Maths and chemistry: write \\(\\dfrac{1}{2}\\), \\(x^{2}\\), \\(\\ce{H2SO4}\\), \\(\\ce{2H2 + O2 -> 2H2O}\\). The preview shows how students will see it.';
function qEditFields(q,i,pq){
  let ans='';
  if(q.k==='mc')ans=`<div class="field"><label>Options, one per line</label><textarea class="txt" data-f="o${i}" rows="4">${esc(q.o.join('\n'))}</textarea></div><div class="field"><label>Number of the correct option (1 = first)</label><input class="txt" type="number" min="1" data-f="a${i}" value="${q.a+1}"></div>`;
  else if(q.k==='tf')ans=`<div class="field"><label>Correct answer</label><select class="txt" data-f="a${i}"><option value="1" ${q.a?'selected':''}>True</option><option value="0" ${q.a?'':'selected'}>False</option></select></div>`;
  else ans=`<div class="field"><label>Accepted answers, separated by commas</label><input class="txt" data-f="a${i}" value="${esc(q.a.join(', '))}"></div>`;
  return `<div class="qedit"><span class="lbl">${pq?'Question':`Question ${i+1}`}</span><div class="field"><label>Question text</label><textarea class="txt" data-f="p${i}" rows="3">${esc(q.p)}</textarea></div>${ans}
    <div class="field"><label>Difficulty</label><select class="txt" data-f="d${i}">${['easy','medium','hard'].map(d=>`<option ${(q.d||'medium')===d?'selected':''}>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Why the answer is right</label><textarea class="txt" data-f="s${i}" rows="3">${esc(q.sol||'')}</textarea></div>
    <div class="field"><label>Solution steps, one per line (optional)</label><textarea class="txt" data-f="t${i}" rows="3">${esc((q.steps||[]).join('\n'))}</textarea></div></div>`;
}
function itemEditHtml(f){
  const top=f.w?`<div class="field"><label>Problem</label><textarea class="txt" data-f="t" rows="3">${esc(f.t)}</textarea></div>
    <div class="field"><label>Steps, one per line</label><textarea class="txt" data-f="ws" rows="5">${esc(f.w.steps.join('\n'))}</textarea></div>
    <div class="field"><label>Answer</label><input class="txt" data-f="wa" value="${esc(f.w.ans)}"></div>
    <div class="field"><label>Why this is correct</label><textarea class="txt" data-f="wy" rows="3">${esc(f.w.why||'')}</textarea></div>
    <div class="field"><label>Common mistakes, one per line</label><textarea class="txt" data-f="wm" rows="3">${esc((f.w.mistakes||[]).join('\n'))}</textarea></div>`
   :`<div class="field"><label>Fact</label><textarea class="txt" data-f="t" rows="3">${esc(f.t)}</textarea></div>
    <div class="field"><label>Why (explanation)</label><textarea class="txt" data-f="why" rows="4">${esc(f.why||'')}</textarea></div>
    <div class="field"><label>Example (optional)</label><textarea class="txt" data-f="ex" rows="3">${esc(f.ex||'')}</textarea></div>`;

}
function readQ(box,q,i){
  const g=k=>{const el=box.querySelector(`[data-f="${k}${i}"]`);return el?el.value:''};const n=Object.assign({},q,{p:g('p').trim(),d:g('d')||q.d,sol:g('s').trim(),steps:lines(g('t'))});
  if(!n.steps.length)n.steps=null;
  if(!n.p)throw `Question ${i+1} needs some text.`;
  if(q.k==='mc'){n.o=lines(g('o'));if(n.o.length<2)throw `Question ${i+1} needs at least two options.`;const a=Math.round(+g('a'))-1;if(!(a>=0&&a<n.o.length))throw `For question ${i+1}, the correct option must be a number from 1 to ${n.o.length}.`;n.a=a}
  else if(q.k==='tf')n.a=g('a')==='1';
  else{n.a=g('a').split(',').map(x=>x.trim()).filter(Boolean);if(!n.a.length)throw `Question ${i+1} needs at least one accepted answer.`}
  return n;
}
function readItem(box,f){
  const g=k=>{const el=box.querySelector(`[data-f="${k}"]`);return el?el.value:''};const n=JSON.parse(JSON.stringify(f));
  n.t=g('t').trim();if(!n.t)throw f.w?'The problem needs some text.':'The fact needs some text.';
  if(f.w){n.w.steps=lines(g('ws'));if(!n.w.steps.length)throw 'Add at least one step.';n.w.ans=g('wa').trim();n.w.why=g('wy').trim();n.w.mistakes=lines(g('wm'))}
  else{n.why=g('why').trim();n.ex=g('ex').trim()}
  n.q=(f.q||[]).map((q,i)=>readQ(box,q,i));return n;
}
function previewItem(f,pq){

/* ---------- importing prepared course content (no AI needed on the site) ---------- */
// A course file holds a course's topics, all 3 lesson levels per topic, past questions and (optionally) pictures.
// It is written by Claude in chat or by any AI using public/ai-prompt.txt. Importing merges into a course:
// topics are matched by name, a level in the file replaces that level, and past questions already there are skipped.
const matchUnit=(s,name)=>{const n=norm(name||'');return n?s.units.find(u=>norm(u.name)===n)||null:null};
const IMP_LATEX=/(?<!\\)\\(frac|dfrac|tfrac|times|text|textrm|mathrm|mathbf|sqrt|ce|cdot|div|pm|mp|rightarrow|leftarrow|longrightarrow|xrightarrow|rightleftharpoons|leftrightarrow|to|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|rho|sigma|omega|Omega|phi|approx|neq|leq|geq|le|ge|infty|log|ln|sin|cos|tan|circ|degree|quad|qquad|left|right|overline|vec|hat|ldots|cdots|dots|sum|int|propto|equiv|therefore|because|uparrow|downarrow|angle|triangle|parallel|perp|in|notin|cup|cap|subset|mathbb|operatorname|displaystyle|underline|boxed|prime|partial|nabla|epsilon|varepsilon|eta|kappa|tau|chi|psi|zeta|xi|nu)(?![a-zA-Z])/g;
// Reads a course file. AIs often forget to double the backslashes in LaTeX ("\frac" silently becomes a form feed + "rac"), so those are repaired first.
function impParse(raw){
  const t=String(raw||'').replace(/^\uFEFF/,'').replace(/```(?:json)?/gi,''),a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)throw 'No course file found. It should start with { and end with }.';
  const body=t.slice(a,b+1),fix=x=>x.replace(IMP_LATEX,'\\\\$1').replace(/(?<!\\)\\(?=[()\[\]{},;:! %$&#_^~|<>.'-])/g,'\\\\');
  try{return JSON.parse(fix(body))}catch(e){try{return JSON.parse(body)}catch(e2){throw `The file has a JSON mistake (${e2.message}). Ask the AI to send that batch again as valid JSON.`}}
}
const impAI=o=>String(o&&o.source||'ai').trim().toLowerCase()!=='materials';
// A theory past question: free-written answer marked against key points.
async function impTheory(x,where,P){

<<<

>>>

// 15 questions from all 3 levels of the topic, plus up to 5 past questions matched to it.
// 30 s per question (45 s for hard ones); unused time carries over to the next question.
// No going back: a question is locked once you move past it, answered or not. When time runs out it moves on by itself.

function buildQuiz(t){
  const own=[];allFacts(t).forEach(f=>(f.q||[]).forEach(q=>{if(q.k==='mc'||q.k==='tf')own.push({q,f,fid:f.id})}));
  const pq=(PQ[t.sub.id]||[]).filter(r=>r.unit===t.id&&r.q&&!r.q.hidden&&Number.isInteger(r.q.a)).map(r=>{const q=pqQ(r);return{q,f:{id:'pq:'+r.id,t:q.p,why:q.sol||'',L:2},fid:'pq:'+r.id,pq:true}});

}

// Days until a course is finished if the student meets every daily target from today.
function finishIn(s){if(!activeS(s))return null;let rem=sRemain(s,false),k=today();if(rem<.01)return 0;
  for(let i=0;i<1500;i++){rem-=sTarget(s,k,rem);if(rem<=1e-6)return i+1;k=addDays(k,1)}return null}
function finishText(s){
  if(!exDate(s))return 'No exam time set yet. Choose your own below to get daily targets.';
  if(!activeS(s))return 'This course\'s schedule has ended. Keep reviewing to stay sharp.';
  const n=finishIn(s);if(n===0)return 'You\'ve covered every session. Keep reviewing to stay sharp.';
  if(n==null)return 'Add study days for this course to your timetable to see when you\'ll finish.';
  const span=n<14?`${n} day${n===1?'':'s'}`:`${Math.round(n/7)} weeks`;
  return `Meeting your targets every day, you'll finish this course in about ${span}.`;
}
// Spreads registered courses over the chosen days, giving busier courses more days, and balancing each day's load.
let AUTO={days:[1,2,3,4,5,6],time:''};
function autoPlan(days,time){
  const subs=planSubs(),load={},tt={};[0,1,2,3,4,5,6].forEach(d=>{tt[d]={on:false,time:'',subs:null};load[d]=0});
  days.forEach(d=>{tt[d]={on:true,time,subs:[]}});
  const need=subs.map(s=>{const left=activeS(s)?Math.max(1,(Date.parse(exDate(s))-Date.parse(today()))/864e5):60;return{s,perWeek:sRemain(s,false)/(left/7)}}).sort((a,b)=>b.perWeek-a.perWeek);
  need.forEach(({s,perWeek})=>{const k=Math.min(days.length,Math.max(2,Math.ceil(perWeek/2)));
    const order=[...days].sort((a,b)=>load[a]-load[b]||((a+6)%7)-((b+6)%7));const pick=[];
    for(const d of order){if(pick.length>=k)break;if(k<days.length&&pick.some(p=>Math.abs(((p+6)%7)-((d+6)%7))===1)&&order.filter(x=>!pick.includes(x)).length>k-pick.length)continue;pick.push(d)}
    for(const d of order){if(pick.length>=k)break;if(!pick.includes(d))pick.push(d)}
    pick.forEach(d=>{tt[d].subs.push(s.id);load[d]+=perWeek/k})});
  days.forEach(d=>{if(!tt[d].subs.length)tt[d].on=false;else if(tt[d].subs.length===subs.length)tt[d].subs=null});
  S.plan.tt=tt;save();
}

async function genKeys(){
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)),jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  const enc=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const secret=enc(crypto.getRandomValues(new Uint8Array(24)));
  const rows=[['VAPID_PUBLIC_KEY',enc(raw)],['VAPID_PRIVATE_KEY',jwk.d],['CRON_SECRET',secret]];
  $('#keysOut').innerHTML='<p class="help" style="margin-top:12px">Copy these now. They are not saved anywhere, and the private key and secret must stay private.</p>'+rows.map(([n,v],i)=>`<span class="lbl">${n}</span><code id="kv${i}"></code><button class="btn ghost" data-copy="${i}" style="width:100%;margin-bottom:12px;min-height:44px">Copy ${n}</button>`).join('');
  rows.forEach(([n,v],i)=>{$('#kv'+i).textContent=v;$(`[data-copy="${i}"]`).onclick=async()=>{try{await navigator.clipboard.writeText(v);toast(n+' copied')}catch(e){toast('Select the text and copy it manually.')}}});
}

function authErr(e){const m=(e&&e.message||'').toLowerCase(),c=e&&e.code||'';

    let own=false;try{own=localStorage.getItem(ownKey())==='1'}catch(e){}
    if(PROFILE.device&&PROFILE.device!==DEVICE&&own)return kick(); // this device held the account, then someone signed in elsewhere
    if(PROFILE.device!==DEVICE){chk(await SB.from('profiles').update({device:DEVICE,device_at:new Date().toISOString()}).eq('id',UID));try{await SB.auth.signOut({scope:'others'})}catch(e){}}
    try{localStorage.setItem(ownKey(),'1')}catch(e){}
    ADMIN=!!PROFILE.is_admin;S=load();
    const rs=PROFILE.state||{};if(rs.v&&(rs.t||0)>(S.t||0)){S=merge(rs);try{localStorage.setItem(KEY+'-'+UID,JSON.stringify(S))}catch(e){}}else if(S.t)push();
    await loadSubjects();
    const mine=new Set(Object.keys(S.tp).map(k=>(SUBS.find(s=>k.startsWith(s.id+'u'))||{}).id).filter(Boolean).concat(S.plan.subs.filter(id=>SUBS.some(s=>s.id===id))));
    await Promise.all([...mine].map(loadLessons));if(ADMIN)await loadLessonIds();
  }catch(e){renderAuth('Could not load your account. Check your connection and refresh the page.');return}
  swReg();save();
  nextStep();
  setInterval(()=>{if(!$('#home').hidden)renderHome()},5*60e3);setInterval(()=>{if(!document.hidden)checkDevice()},60e3);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDevice();if(!$('#home').hidden)renderHome()}});
}
(async()=>{
  const H=new URLSearchParams(location.hash.slice(1)),Q=new URLSearchParams(location.search),RECOVERY=H.get('type')==='recovery';
  const LINKERR=H.get('error_description')||Q.get('error_description');
  try{const c=await (await fetch('/api/config')).json();CFG=c;SB=supabase.createClient(c.url,c.anon,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true}})}catch(e){$('#auth').innerHTML='<h1>Stride</h1><p>Could not start. Check your connection and refresh.</p>';return}
  let started=false;
  let recovering=RECOVERY;
  SB.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;started=true;setTimeout(renderNewPw,0);return}
    if(session&&!started&&!recovering){started=true;setTimeout(()=>startApp(session),0)}});
  const {data}=await SB.auth.getSession();
  if(LINKERR){history.replaceState(null,'',location.pathname);if(!data.session){renderAuth(/expired|invalid/i.test(LINKERR)?'That link has expired or was already used. Sign in, or request a new link.':LINKERR,'in');return}}
  if(recovering){started=true;history.replaceState(null,'',location.pathname);renderNewPw();return}
  if(data.session){if(!started){started=true;startApp(data.session)}}else renderAuth();
  window.addEventListener('pagehide',()=>{if(UID)push()});
})();
}
